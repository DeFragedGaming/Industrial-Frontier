name: Linux - Stage 10 Part One

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industrial-frontier-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Ubuntu 24.04 / C++20 / SDL3
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl unzip \
            libgl1-mesa-dev libopengl0 libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev \
            libdecor-0-dev libpipewire-0.3-dev

      - name: Configure Release build
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINDUSTRIAL_FRONTIER_BUILD_DATABASE_TESTS=ON

      - name: Build game and tests
        run: cmake --build build-linux --parallel 4

      - name: Run regression tests
        run: ctest --test-dir build-linux --output-on-failure --parallel 2

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialFrontier-Linux-TestLog
          path: build-linux/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Package Linux build
        run: bash tools/linux/package.sh build-linux dist

      - name: Verify package
        run: |
          tar -tzf dist/IndustrialFrontier-Stage10-Part1-Linux-x64.tar.gz | grep -F '/run.sh'
          tar -tzf dist/IndustrialFrontier-Stage10-Part1-Linux-x64.tar.gz | grep -F '/IndustrialFrontier'
          tar -tzf dist/IndustrialFrontier-Stage10-Part1-Linux-x64.tar.gz | grep -F '/assets/'

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialFrontier-Stage10-Part1-Linux-x64
          path: dist/IndustrialFrontier-Stage10-Part1-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
