name: Industrial Frontier Linux v6

on:
  push:
    tags:
      - 'v6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libopengl-dev libopengl0 \
            libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Package Linux x64
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME='IndustrialFrontier-v6-Linux-x64'
          PACKAGE_DIR="dist/$PACKAGE_NAME"
          mkdir -p "$PACKAGE_DIR"
          install -m 755 build-linux/IndustrialFrontier "$PACKAGE_DIR/IndustrialFrontier"
          cp -a assets "$PACKAGE_DIR/assets"

          SDL_LIBRARY="$(find build-linux -type f -name 'libSDL3.so.0*' -print -quit)"
          if [ -z "$SDL_LIBRARY" ]; then
            echo 'SDL3 shared library not found.' >&2
            exit 1
          fi
          install -m 755 "$SDL_LIBRARY" "$PACKAGE_DIR/libSDL3.so.0"

          cat > "$PACKAGE_DIR/run.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec ./IndustrialFrontier "$@"
          SCRIPT
          chmod +x "$PACKAGE_DIR/run.sh"

          cat > "$PACKAGE_DIR/README-Linux.txt" <<'README'
          Industrial Frontier v6 - Linux x64

          Extract the archive and execute ./run.sh from its folder.
          The bundled SDL3 library is loaded by run.sh.
          OpenGL, graphics drivers, and system libraries must be installed separately.
          On Ubuntu 24.04, if libOpenGL.so.0 is missing, run:
            sudo apt-get install -y libopengl0
          README

          LD_LIBRARY_PATH="$PWD/$PACKAGE_DIR" ldd "$PACKAGE_DIR/IndustrialFrontier" | tee dist/ldd-linux.txt
          if grep -q 'not found' dist/ldd-linux.txt; then
            echo 'A Linux shared library dependency is missing.' >&2
            exit 1
          fi
          tar -C dist -czf "dist/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialFrontier-v6-Linux-x64
          path: dist/IndustrialFrontier-v6-Linux-x64.tar.gz
          if-no-files-found: error

      - name: Attach to v6 GitHub Release
        if: github.ref == 'refs/tags/v6'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v6 >/dev/null 2>&1; then
            gh release create v6 --verify-tag --title 'Industrial Frontier v6' --notes 'Showcase v6: Saves, terrain streaming, procedural caves, and gameplay HUD.'
          fi
          gh release upload v6 dist/IndustrialFrontier-v6-Linux-x64.tar.gz --clobber
